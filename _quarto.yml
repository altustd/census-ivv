project:
  type: book
  output-dir: docs

book:
  title: "US Census IV&V"
  subtitle: "Independent Verification of Census Bureau Data Releases"
  author: "Troy Altus"
  date: "2026"
  repo-url: https://github.com/altustd/census-ivv
  chapters:
    - preface.qmd
    - index.qmd
    - 02-education-enrollment-2024.qmd
    - references.qmd
  appendices:
    - appendix-a-code.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    fig-align: center
    code-fold: true
    code-tools: true
    self-contained: false
  pdf:
    documentclass: book
    classoption: [letterpaper, 11pt]
    geometry:
      - top=1in
      - bottom=1in
      - left=1.25in
      - right=1in
    number-sections: true
    colorlinks: true
    toc: true
    toc-depth: 3
    pdf-engine: latexmk
    pdf-engine-opts:
      - -lualatex

bibliography: references.bib
execute:
  warning: false
  message: false
