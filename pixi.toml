[workspace]
name = "census-ivv"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
pandas = ">=2.0"
numpy = ">=1.26"
plotly = ">=5.18"
matplotlib = ">=3.8"
requests = ">=2.31"
python-dotenv = ">=1.0"
jupyter = ">=1.0"
ipykernel = ">=6.0"

[tasks]
render     = "quarto render"
render-pdf = "quarto render --to pdf"
preview    = "quarto preview"
kernel     = "python -m ipykernel install --user --name census-ivv --display-name 'Census IV&V'"
